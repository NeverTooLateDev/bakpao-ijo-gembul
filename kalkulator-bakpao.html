<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pesanan Bakpao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF2DE;
    --paper:#FFFDF8;
    --bamboo:#7A5230;
    --bamboo-dark:#4A331F;
    --vermillion:#C1440E;
    --vermillion-dark:#9C3308;
    --leaf:#45633F;
    --ink:#2B2118;
    --ink-soft:#6b5c4d;
    --line: rgba(74,51,31,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(122,82,48,0.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(193,68,14,0.06), transparent 45%),
      var(--cream);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  /* header */
  header{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
  header h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,38px);
    color:var(--bamboo-dark);
    margin:0;
    letter-spacing:-0.01em;
  }
  header p{margin:4px 0 0;color:var(--ink-soft);font-size:15px;}
  .steamer-icon{flex:none;}

  main{
    display:grid;
    grid-template-columns: 1.35fr 1fr;
    gap:28px;
    margin-top:28px;
    align-items:start;
  }
  @media (max-width:820px){ main{grid-template-columns:1fr;} }

  /* menu cards */
  .menu-list{display:flex;flex-direction:column;gap:12px;}
  .menu-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 1px 2px rgba(74,51,31,0.04);
  }
  .bun-icon{flex:none;}
  .menu-info{flex:1;min-width:0;}
  .menu-info .nama{font-weight:700;font-size:16px;color:var(--ink);}
  .menu-info .harga{
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .stepper{display:flex;align-items:center;gap:0;flex:none;background:var(--cream);border-radius:10px;border:1px solid var(--line);}
  .stepper button{
    width:32px;height:32px;border:none;background:transparent;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;
    color:var(--bamboo-dark);cursor:pointer;border-radius:10px;
    transition:background .15s;
  }
  .stepper button:hover{background:rgba(122,82,48,0.14);}
  .stepper input{
    width:36px;text-align:center;border:none;background:transparent;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--ink);
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  section.menu-section h2, .ticket h2{
    font-family:'Fredoka',sans-serif;font-size:18px;color:var(--bamboo-dark);margin:0 0 12px;
  }

  /* order ticket - signature element */
  .ticket{
    background:var(--paper);
    border-radius:18px;
    position:sticky;
    top:24px;
    box-shadow:0 6px 24px rgba(74,51,31,0.10);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .ticket-head{
    background:var(--bamboo-dark);
    color:var(--cream);
    padding:16px 20px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .ticket-head h2{color:var(--cream);margin:0;}
  .ticket-head .no{font-family:'JetBrains Mono',monospace;font-size:12px;opacity:.75;}
  .perforation{
    height:12px;
    background-image: radial-gradient(circle at 6px 6px, var(--cream) 5px, transparent 5.5px);
    background-size: 16px 12px;
    background-position: -4px 0;
  }
  .ticket-body{padding:18px 20px 8px;}
  .empty-msg{color:var(--ink-soft);font-size:14px;text-align:center;padding:18px 0;}
  .item-row{
    display:flex;align-items:flex-start;gap:8px;
    padding:8px 0;
    border-bottom:1px dotted var(--line);
    font-size:14px;
  }
  .item-row:last-child{border-bottom:none;}
  .pleat{flex:none;margin-top:3px;}
  .item-row .desc{flex:1;min-width:0;}
  .item-row .desc .n{font-weight:600;color:var(--ink);}
  .item-row .desc .q{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:12.5px;}
  .item-row .sub{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);white-space:nowrap;}

  .ticket-total{
    margin-top:6px;
    border-top:2px dashed var(--line);
    padding:14px 20px 6px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .ticket-total .label{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--bamboo-dark);font-size:15px;}
  .ticket-total .amount{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;color:var(--vermillion);}

  .stamp{
    position:absolute;
    top:64px;right:22px;
    width:70px;height:70px;
    border:2.5px solid var(--vermillion);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-14deg);
    opacity:0.85;
    pointer-events:none;
  }
  .stamp span{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:11px;color:var(--vermillion);
    text-align:center;line-height:1.15;letter-spacing:.04em;
  }

  form.customer{padding:4px 20px 20px;display:flex;flex-direction:column;gap:10px;}
  form.customer label{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  form.customer input, form.customer textarea{
    width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
    background:var(--cream);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--ink);
    outline:none;
  }
  form.customer input:focus, form.customer textarea:focus{border-color:var(--bamboo);}
  form.customer textarea{resize:vertical;min-height:44px;}

  .settings{padding:0 20px 14px;}
  .settings summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:600;user-select:none;}
  .settings input{margin-top:8px;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--cream);font-family:'JetBrains Mono',monospace;font-size:12.5px;}

  .send-btn{
    margin:6px 20px 20px;
    background:var(--vermillion);
    color:#fff;border:none;border-radius:12px;
    padding:13px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15.5px;
    cursor:pointer;transition:background .15s, transform .1s;
  }
  .send-btn:hover{background:var(--vermillion-dark);}
  .send-btn:active{transform:scale(0.98);}
  .send-btn:disabled{opacity:.55;cursor:not-allowed;}

  .status{margin:0 20px 18px;font-size:13.5px;padding:10px 12px;border-radius:10px;display:none;}
  .status.show{display:block;}
  .status.ok{background:rgba(69,99,63,0.12);color:var(--leaf);}
  .status.err{background:rgba(193,68,14,0.10);color:var(--vermillion-dark);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="steamer-icon" width="52" height="52" viewBox="0 0 52 52" fill="none">
      <ellipse cx="26" cy="42" rx="20" ry="6" fill="var(--bamboo)" opacity="0.25"/>
      <rect x="8" y="26" width="36" height="16" rx="3" fill="var(--bamboo)"/>
      <rect x="8" y="26" width="36" height="16" rx="3" stroke="var(--bamboo-dark)" stroke-width="1.2" fill="none" opacity="0.3"/>
      <path d="M8 26 L44 26 M8 31 L44 31 M8 36 L44 36" stroke="var(--bamboo-dark)" stroke-width="1" opacity="0.3"/>
      <ellipse cx="26" cy="24" rx="19" ry="6.5" fill="var(--cream)" stroke="var(--bamboo-dark)" stroke-width="1.4"/>
      <circle cx="18" cy="16" r="7.5" fill="var(--paper)" stroke="var(--bamboo-dark)" stroke-width="1.3"/>
      <circle cx="30" cy="13" r="8.5" fill="var(--paper)" stroke="var(--bamboo-dark)" stroke-width="1.3"/>
      <path d="M30 6 Q31 9 29.5 11 M27 8 Q29 10.5 28 13" stroke="var(--vermillion)" stroke-width="1" opacity="0.5" fill="none"/>
    </svg>
    <div>
      <h1>Kalkulator Pesanan Bakpao</h1>
      <p>Pilih menu, atur jumlah, total dihitung otomatis — kirim langsung ke Google Sheets kamu.</p>
    </div>
  </header>

  <main>
    <section class="menu-section">
      <h2>Menu</h2>
      <div class="menu-list" id="menuList"></div>
    </section>

    <div class="ticket" style="position:relative;">
      <div class="ticket-head">
        <h2>Kartu Pesanan</h2>
        <span class="no" id="ticketNo">#000</span>
      </div>
      <div class="perforation"></div>
      <div class="stamp" id="stamp" style="display:none;"><span>PESANAN<br>MASUK</span></div>
      <div class="ticket-body" id="ticketBody">
        <p class="empty-msg">Belum ada bakpao dipilih.</p>
      </div>
      <div class="ticket-total">
        <span class="label">Total</span>
        <span class="amount" id="totalAmount">Rp 0</span>
      </div>

      <form class="customer" id="customerForm">
        <div>
          <label>Nama Pemesan</label>
          <input type="text" id="namaPembeli" placeholder="Nama..." required>
        </div>
        <div>
          <label>No. HP / WhatsApp</label>
          <input type="tel" id="noHp" placeholder="08xxxxxxxxxx" required>
        </div>
        <div>
          <label>Catatan (opsional)</label>
          <textarea id="catatan" placeholder="Contoh: tanpa cabe, ambil sore ini..."></textarea>
        </div>
      </form>

      <div class="status" id="statusBox"></div>
      <button class="send-btn" id="sendBtn">Kirim Pesanan</button>
    </div>
  </main>
</div>

<script>
// ==== Edit daftar menu & harga di sini ====
const MENU = [
  { id: 'kacang_hijau', nama: 'Bakpao Kacang Hijau', harga: 8000 },
  { id: 'coklat',       nama: 'Bakpao Coklat',        harga: 8000 },
  { id: 'ayam',         nama: 'Bakpao Ayam',           harga: 10000 },
  { id: 'kacang_merah', nama: 'Bakpao Kacang Merah',   harga: 8000 },
  { id: 'original',     nama: 'Bakpao Original (Mantao)', harga: 6000 },
];
// ===========================================

// URL Google Apps Script (Web App) — sudah di-hardcode, tidak perlu diisi manual
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyD95dKh-AH58V_f7VGcaJwKi6IJkZI_qgn4O7KMZ1WrHb0CkNDwjwUGevm45iCII1Nqw/exec';

const state = {}; // { id: qty } — disimpan di memori saja (bukan localStorage)
MENU.forEach(m => state[m.id] = 0);

function formatRupiah(n){
  return 'Rp ' + n.toLocaleString('id-ID');
}

function bunSVG(){
  return `<svg class="bun-icon" width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="22" r="15" fill="var(--paper)" stroke="var(--bamboo)" stroke-width="1.4"/>
    <path d="M20 7 L20 12 M14 9 Q17 13 20 12 M26 9 Q23 13 20 12" stroke="var(--bamboo)" stroke-width="1.2" fill="none" opacity="0.55"/>
    <circle cx="20" cy="12" r="2" fill="var(--vermillion)" opacity="0.8"/>
  </svg>`;
}
function pleatSVG(){
  return `<svg class="pleat" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="var(--bamboo)" stroke-width="1.3"/><circle cx="7" cy="4.5" r="1.1" fill="var(--vermillion)"/></svg>`;
}

function renderMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = MENU.map(m => `
    <div class="menu-card">
      ${bunSVG()}
      <div class="menu-info">
        <div class="nama">${m.nama}</div>
        <div class="harga">${formatRupiah(m.harga)} / pcs</div>
      </div>
      <div class="stepper">
        <button type="button" onclick="changeQty('${m.id}', -1)">−</button>
        <input type="number" min="0" value="0" id="qty_${m.id}" onchange="setQty('${m.id}', this.value)">
        <button type="button" onclick="changeQty('${m.id}', 1)">+</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta){
  state[id] = Math.max(0, (state[id]||0) + delta);
  document.getElementById('qty_'+id).value = state[id];
  renderTicket();
}
function setQty(id, val){
  const n = Math.max(0, parseInt(val)||0);
  state[id] = n;
  document.getElementById('qty_'+id).value = n;
  renderTicket();
}

function getOrderItems(){
  return MENU.filter(m => state[m.id] > 0).map(m => ({
    id:m.id, nama:m.nama, harga:m.harga, qty:state[m.id], subtotal: m.harga*state[m.id]
  }));
}

function renderTicket(){
  const items = getOrderItems();
  const body = document.getElementById('ticketBody');
  const stamp = document.getElementById('stamp');
  if(items.length === 0){
    body.innerHTML = '<p class="empty-msg">Belum ada bakpao dipilih.</p>';
    stamp.style.display = 'none';
  } else {
    body.innerHTML = items.map(it => `
      <div class="item-row">
        ${pleatSVG()}
        <div class="desc">
          <div class="n">${it.nama}</div>
          <div class="q">${it.qty} × ${formatRupiah(it.harga)}</div>
        </div>
        <div class="sub">${formatRupiah(it.subtotal)}</div>
      </div>
    `).join('');
    stamp.style.display = 'flex';
  }
  const total = items.reduce((s,it)=>s+it.subtotal,0);
  document.getElementById('totalAmount').textContent = formatRupiah(total);
}

document.getElementById('sendBtn').addEventListener('click', async () => {
  const items = getOrderItems();
  const nama = document.getElementById('namaPembeli').value.trim();
  const noHp = document.getElementById('noHp').value.trim();
  const catatan = document.getElementById('catatan').value.trim();
  const url = SCRIPT_URL;
  const statusBox = document.getElementById('statusBox');
  const btn = document.getElementById('sendBtn');

  statusBox.className = 'status';
  if(items.length === 0){ showStatus('Pilih minimal satu bakpao dulu ya.', false); return; }
  if(!nama || !noHp){ showStatus('Nama dan No. HP wajib diisi.', false); return; }

  const total = items.reduce((s,it)=>s+it.subtotal,0);
  const payload = { namaPembeli: nama, noHp, catatan, items, total, waktu: new Date().toISOString() };

  btn.disabled = true; btn.textContent = 'Mengirim...';
  try{
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight ke Apps Script
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(()=> ({}));
    if(res.ok){
      showStatus('Pesanan terkirim! ' + (data.message || 'Tersimpan di Google Sheets.'), true);
      document.getElementById('ticketNo').textContent = '#' + (data.nomorPesanan || '—');
    } else {
      showStatus('Gagal mengirim: server merespons error.', false);
    }
  } catch(e){
    showStatus('Gagal terhubung ke server. Cek URL Apps Script dan koneksi internet.', false);
  } finally {
    btn.disabled = false; btn.textContent = 'Kirim Pesanan';
  }
});

function showStatus(msg, ok){
  const box = document.getElementById('statusBox');
  box.textContent = msg;
  box.className = 'status show ' + (ok ? 'ok' : 'err');
}

renderMenu();
renderTicket();
</script>
</body>
</html>
